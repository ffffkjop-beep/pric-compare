<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>比价小助手</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiYmlqaWEiLCJzaG9ydF9uYW1lIjoiYmlqaWEiLCJzdGFydF91cmwiOiIvIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiI2ZmZiIsInRoZW1lX2NvbG9yIjoiIzM1ODhiZiJ9">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f7fa;padding:14px;color:#222;}
/* 重点修复：全局禁止选中，但输入框放开 */
*{
  -webkit-user-select:none;
  user-select:none;
}
input,textarea{
  -webkit-user-select:text !important;
  user-select:text !important;
  font-size:16px !important;/* iOS必须≥16px，不然双击缩放+键盘异常 */
}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000012;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{grid-template-columns:1fr 1fr 1fr;}
label{display:block;font-size:13px;color:#555;margin-bottom:4px;}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;outline:none;}
input:focus{border-color:#358bbf;}
.btns{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
button{flex:1;padding:11px;border:none;border-radius:8px;background:#358bbf;color:#fff;font-size:15px;}
button.del{background:#e74c3c;}
#list{margin-top:10px;}
.item{border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px;position:relative;}
.best{border-color:#27ae60;background:#f0fff4;}
.best-tag{position:absolute;top:8px;right:8px;background:#27ae60;color:#fff;font-size:12px;padding:2px 6px;border-radius:4px;}
.res-line{font-size:14px;margin:4px 0;}
#export{background:#27ae60;}
</style>
</head>
<body>
<div class="card">
<h3 style="margin-bottom:12px">新增商品</h3>
<div class="row">
  <div>
    <label>商品名称</label>
    <input id="name" placeholder="例如：洗衣液">
  </div>
  <div>
    <label>平台来源</label>
    <input id="site" placeholder="淘宝/京东">
  </div>
</div>
<div class="row">
  <div>
    <label>标价</label>
    <input id="price" type="number" step="0.01" placeholder="原价">
  </div>
  <div>
    <label>数量/规格</label>
    <input id="num" type="number" step="0.01" value="1">
  </div>
</div>
<div class="row row3">
  <div>
    <label>运费</label>
    <input id="freight" type="number" step="0.01" value="0">
  </div>
  <div>
    <label>优惠券</label>
    <input id="coupon" type="number" step="0.01" value="0">
  </div>
  <div>
    <label>满减</label>
    <input id="fullcut" type="number" step="0.01" value="0">
  </div>
</div>
<div class="btns">
  <button onclick="addItem()">添加</button>
  <button id="export" onclick="exportData()">导出</button>
  <button class="del" onclick="clearAll()">清空全部</button>
</div>
</div>

<div id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem('bjdata')) || [];
function save(){localStorage.setItem('bjdata',JSON.stringify(data));}
function calc(item){
  const realPay = Number(item.price)+Number(item.freight)-Number(item.coupon)-Number(item.fullcut);
  const unit = realPay / Number(item.num);
  return {realPay,unit};
}
function render(){
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  if(data.length===0) return;
  const units = data.map(i=>calc(i).unit);
  const min = Math.min(...units);
  data.forEach((item,idx)=>{
    const c = calc(item);
    const isBest = Math.abs(c.unit - min) < 0.0001;
    const div = document.createElement('div');
    div.className = 'item '+(isBest?'best':'');
    div.innerHTML = `
      ${isBest?'<span class="best-tag">最优</span>':''}
      <div class="res-line"><b>${item.name}</b> · ${item.site}</div>
      <div class="res-line">标价：${item.price}｜运费：${item.freight}</div>
      <div class="res-line">券-${item.coupon}｜满减-${item.fullcut}</div>
      <div class="res-line"><b>实付：${c.realPay.toFixed(2)}｜单价：${c.unit.toFixed(2)}</b></div>
      <div class="btns" style="margin-top:8px">
        <button onclick="del(${idx})" class="del">删除</button>
      </div>
    `;
    wrap.appendChild(div);
  })
}
function addItem(){
  const o = {
    name:document.getElementById('name').value.trim(),
    site:document.getElementById('site').value.trim(),
    price:Number(document.getElementById('price').value||0),
    num:Number(document.getElementById('num').value||1),
    freight:Number(document.getElementById('freight').value||0),
    coupon:Number(document.getElementById('coupon').value||0),
    fullcut:Number(document.getElementById('fullcut').value||0),
  }
  if(!o.name){alert('请填商品名称');return;}
  data.push(o);
  save();render();
  //清空输入框
  document.getElementById('name').value='';
  document.getElementById('site').value='';
  document.getElementById('price').value='';
  document.getElementById('num').value='1';
  document.getElementById('freight').value='0';
  document.getElementById('coupon').value='0';
  document.getElementById('fullcut').value='0';
}
function del(i){
  data.splice(i,1);save();render();
}
function clearAll(){
  if(confirm('确定清空所有记录？')){data=[];save();render();}
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;a.download='比价记录.json';a.click();
  URL.revokeObjectURL(url);
}
render();
</script>
</body>
</html>
